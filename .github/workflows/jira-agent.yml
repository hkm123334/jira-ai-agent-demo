name: Jira-to-PR AI Agent

on:
  # Automatic trigger from Jira Automation (repository_dispatch)
  repository_dispatch:
    types: [jira-ticket-ready, jira-ticket-approved]

  # Manual trigger for instant testing from GitHub Actions tab
  workflow_dispatch:
    inputs:
      ticket_id:
        description: "Jira Ticket ID (e.g., PROJ-101)"
        required: true
      mode:
        description: "analyze (Impact Report) or apply (Code Edit + Draft PR)"
        required: true
        default: "analyze"
        type: choice
        options:
          - analyze
          - apply

permissions:
  contents: write
  pull-requests: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install agent dependencies
        run: pip install -r ai_agent/requirements.txt

      - name: Run AI Agent
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BASE_BRANCH: ${{ github.ref_name }}
          TEST_COMMAND: ${{ vars.TEST_COMMAND }}
        run: |
          TICKET="${{ github.event.client_payload.ticket_id || github.event.inputs.ticket_id }}"
          if [ "${{ github.event.action }}" = "jira-ticket-approved" ]; then
            MODE="apply"
          elif [ "${{ github.event.action }}" = "jira-ticket-ready" ]; then
            MODE="analyze"
          else
            MODE="${{ github.event.inputs.mode }}"
          fi
          python ai_agent/main.py --ticket "$TICKET" --mode "$MODE"
